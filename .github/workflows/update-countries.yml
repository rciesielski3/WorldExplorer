name: Update Countries Data

on:
  schedule:
    - cron: "0 3 1 * *" # 1st of every month at 3 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Local git hooks (gitleaks pre-commit) must not run in CI commits.
      HUSKY: "0"
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update countries dataset
        run: npm run countries:update

      - name: Validate countries dataset
        run: npm run countries:validate

      # create-pull-request does nothing when there is no diff, and makes its
      # own commit and branch when there is one.
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # BOT_PR_TOKEN (PAT/App token) lets PR Validation run on the bot PR;
          # falls back to GITHUB_TOKEN, whose PRs do not trigger workflows.
          token: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
          add-paths: data/countries.json
          author: Countries Bot <bot@worldexplorer.local>
          committer: Countries Bot <bot@worldexplorer.local>
          commit-message: |
            chore: update countries dataset

            Automated monthly update from countries.dev + mledoze/countries sources.
            All country descriptions preserved during this update.
          branch: chore/countries-dataset-${{ github.run_number }}
          title: "chore: monthly countries dataset update"
          body: |
            ## Monthly Countries Dataset Update

            Automated update of `data/countries.json` from countries.dev and
            mledoze/countries.

            ### What ran in this workflow
            - `npm run countries:update`
            - `npm run countries:validate` (passed)

            `npm test` was not run by the workflow; please review the diff
            and run the checks before merging.
          labels: "chore,automated"
          delete-branch: true

      - name: Summary
        env:
          CPR_OP: ${{ steps.cpr.outputs.pull-request-operation }}
          CPR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          if [ -z "$CPR_OP" ]; then
            echo "Dataset is up to date, no changes needed"
          else
            echo "Pull request $CPR_OP: $CPR_URL"
          fi
