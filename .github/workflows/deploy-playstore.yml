name: Deploy to Play Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.3.0)'
        required: false
        type: string
      track:
        description: 'Play Store release track'
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      release_notes:
        description: 'Release notes for Play Store'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$INPUT_VERSION" ]; then
            VERSION=$(grep 'versionName' android/app/build.gradle | sed -n 's/.*versionName "\(.*\)".*/\1/p')
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Build AAB
        id: build
        uses: ./.github/actions/build-aab
        with:
          java-home: ${{ env.JAVA_HOME }}
          android-home: ${{ env.ANDROID_HOME }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Verify Signing
        uses: ./.github/actions/sign-aab
        with:
          expected-sha1: '34:C6:3A:57:7B:3C:06:5F:B3:5D:18:C6:65:E3:B6:6B:3A:29:F9:5F'

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.adateo.WorldExplorer
          releaseFiles: 'android/app/build/outputs/bundle/release/app-release.aab'
          tracks: ${{ inputs.track }}
          releaseName: 'v${{ steps.version.outputs.version }}'
          status: completed

      - name: Release date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: inputs.track == 'production'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/bundle/release/app-release.aab
          tag_name: v${{ steps.version.outputs.version }}
          body: |
            # WorldExplorer v${{ steps.version.outputs.version }}

            ## Release Track
            **${{ inputs.track }}** track deployment

            ## Release Notes
            ${{ inputs.release_notes || 'No additional notes provided' }}

            ## Build Details
            - Platform: Android
            - Build Type: release
            - Signing: production keystore
            - Date: ${{ steps.date.outputs.date }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment Summary
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TRACK: ${{ inputs.track }}
        run: |
          echo "✅ Deployment completed"
          echo "📦 Version: v$RELEASE_VERSION"
          echo "📍 Track: $RELEASE_TRACK"
          echo "🏪 Play Store: app-release.aab uploaded"
          if [ "$RELEASE_TRACK" = "production" ]; then
            echo "🏷️ GitHub Release: v$RELEASE_VERSION created"
          fi
