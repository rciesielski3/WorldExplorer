name: Deploy to Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store release track'
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      release_notes:
        description: 'Release notes for the GitHub release (production track only)'
        required: false
        type: string
      dry_run:
        description: 'Build and verify only: no Play Store upload, no tag, no GitHub release'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.inputs.dry_run == 'false' && 'publish' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Production upload certificate (public fingerprint, not a secret).
  EXPECTED_SIGNING_SHA1: '34:C6:3A:57:7B:3C:06:5F:B3:5D:18:C6:65:E3:B6:6B:3A:29:F9:5F'

# Publishing guards compare github.event.inputs.dry_run (always a string) to
# 'false', so anything other than an explicit false skips upload, tag and release.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      uploaded: ${{ steps.upload.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Fail fast (seconds, before Node/npm/Gradle) on reused versionCode,
      # disagreeing version sources, or a real publish from a non-main ref.
      # Uses the runner's preinstalled Node; scripts/version has no dependencies.
      - name: Deploy guard
        env:
          # Same normalization as the publish conditions: only 'false' publishes.
          DRY_RUN: ${{ github.event.inputs.dry_run == 'false' && 'false' || 'true' }}
          REF: ${{ github.ref }}
        run: node scripts/version/deploy-guard.js

      - name: Determine version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle)
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from android/app/build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci --maxWorkers=2

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Build AAB
        uses: ./.github/actions/build-aab
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Verify AAB signature
        id: signature
        uses: ./.github/actions/verify-aab-signature
        with:
          expected-sha1: ${{ env.EXPECTED_SIGNING_SHA1 }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Upload to Play Store
        id: upload
        if: ${{ github.event.inputs.dry_run == 'false' && github.ref == 'refs/heads/main' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.adateo.WorldExplorer
          releaseFiles: 'android/app/build/outputs/bundle/release/app-release.aab'
          tracks: ${{ inputs.track }}
          releaseName: 'v${{ steps.version.outputs.version }}'
          status: completed

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TRACK: ${{ inputs.track }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REF: ${{ github.ref }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          SIGNING_SHA1: ${{ steps.signature.outputs.sha1 }}
        run: |
          SIZE=$(du -h android/app/build/outputs/bundle/release/app-release.aab | cut -f1)
          if [ "$UPLOAD_OUTCOME" = "success" ]; then
            HEADLINE="PUBLISHED: track=$TRACK versionCode=$VERSION_CODE"
            MODE="uploaded to $TRACK"
          elif [ "$DRY_RUN" = "false" ]; then
            HEADLINE="NOT PUBLISHED: real run refused because ref is $REF (uploads are allowed from refs/heads/main only)"
            MODE="refused (non-main ref)"
          else
            HEADLINE="DRY RUN: nothing was uploaded"
            MODE="dry run (nothing published)"
          fi
          {
            echo "## $HEADLINE"
            echo ""
            echo "### Release build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | $VERSION |"
            echo "| Version code | $VERSION_CODE |"
            echo "| Track | $TRACK |"
            echo "| Mode | $MODE |"
            echo "| AAB size | $SIZE |"
            echo "| Signing SHA1 | \`$SIGNING_SHA1\` (matches expected) |"
          } >> "$GITHUB_STEP_SUMMARY"

  tag-build:
    needs: build
    # always(): tag even if a step after the upload (e.g. Summary) failed the build job;
    # an uploaded versionCode must never be left without its tag.
    if: ${{ always() && needs.build.result != 'cancelled' && needs.build.outputs.uploaded == 'true' && github.event.inputs.dry_run == 'false' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag uploaded build
        env:
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          VERSION: ${{ needs.build.outputs.version }}
          TRACK: ${{ github.event.inputs.track }}
        run: |
          TAG="build-${VERSION_CODE}"
          EXISTING=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}" || true)
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" = "$GITHUB_SHA" ]; then
              echo "Tag ${TAG} already points at ${GITHUB_SHA}; nothing to do"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${EXISTING}, not ${GITHUB_SHA}; versionCode was uploaded from a different commit"
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" "$GITHUB_SHA" -m "Play upload: versionCode ${VERSION_CODE}, v${VERSION}, track ${TRACK}"
          git push origin "refs/tags/${TAG}"

  release:
    needs: build
    if: ${{ github.event.inputs.dry_run == 'false' && github.event.inputs.track == 'production' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.aab
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            # WorldExplorer v${{ needs.build.outputs.version }}

            ## Release Track
            **${{ inputs.track }}** track deployment

            ## Release Notes
            ${{ inputs.release_notes || 'No additional notes provided' }}

            ## Build Details
            - Platform: Android
            - Build Type: release
            - Signing: production keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
